<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DG Sistemas - Gestão de Campeonatos</title>
  <meta name="description" content="DG Sistemas - Gestão profissional para o futebol. Campeonatos, jogos, súmulas, classificação, artilharia e notícias.">
  <meta property="og:title" content="DG Sistemas - Gestão de Campeonatos">
  <meta property="og:description" content="DG Sistemas - Gestão profissional para o futebol.">
  <meta property="og:url" content="https://dgsistema.github.io/dg-sistemas/">

  <meta name="theme-color" content="#04132d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DG Sistemas">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root{
      --yellow:#ffd400;
      --yellow-2:#ffe600;
      --yellow-soft:rgba(255,212,0,.12);
      --yellow-line:rgba(255,212,0,.22);
      --white:#ffffff;
      --muted:#d8e1ef;
      --text-soft:#a8b6cf;
      --shadow:0 12px 30px rgba(0,0,0,.35);
      --transition:.25s ease;
      --max:1280px;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    html{
      scroll-behavior:smooth;
      width:100%;
      max-width:100%;
      overflow-x:hidden;
    }

    body{
      width:100%;
      max-width:100%;
      font-family:Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(1,7,18,.36), rgba(1,7,18,.58)),
        url("fundo.png") center top / cover fixed no-repeat;
      color:var(--white);
      overflow-x:hidden;
    }

    a{text-decoration:none;color:inherit;transition:var(--transition);}
    button{font-family:inherit;transition:var(--transition);cursor:pointer;border:none;background:none;}
    ul{list-style:none;}
    img{max-width:100%;display:block;}

    .wrap{
      width:min(100% - 32px, var(--max));
      margin:0 auto;
    }

    .sidebar-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      opacity:0;
      visibility:hidden;
      transition:var(--transition);
      z-index:998;
    }

    .sidebar-overlay.show{
      opacity:1;
      visibility:visible;
    }

    .sidebar{
      position:fixed;
      top:0;
      left:0;
      width:320px;
      max-width:88%;
      height:100vh;
      background:linear-gradient(180deg, #04132d 0%, #021022 100%);
      border-right:1px solid var(--yellow-line);
      box-shadow:var(--shadow);
      padding:22px 18px 28px;
      overflow-y:auto;
      transform:translateX(-105%);
      transition:var(--transition);
      z-index:999;
    }

    .sidebar.open{
      transform:translateX(0);
    }

    .sidebar-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:20px;
      padding-bottom:16px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .sidebar-brand{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .sidebar-brand img{
      width:90px;
      height:90px;
      object-fit:contain;
      border:none;
      background:transparent;
      border-radius:0;
      padding:0;
      filter:drop-shadow(0 5px 12px rgba(0,0,0,.45));
    }

    .sidebar-brand-text strong{
      display:block;
      font-size:16px;
      color:var(--yellow);
      line-height:1.25;
    }

    .sidebar-brand-text span{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
    }

    .sidebar-close{
      width:36px;
      height:36px;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:24px;
    }

    .sidebar-close:hover{
      background:var(--yellow);
      color:#08172c;
    }

    .sidebar-block{
      margin-bottom:22px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      border-radius:16px;
      padding:14px;
    }

    .sidebar-title{
      font-size:14px;
      font-weight:700;
      color:var(--yellow);
      margin-bottom:12px;
      letter-spacing:.4px;
    }

    .side-menu{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .side-menu a{
      display:flex;
      align-items:center;
      gap:10px;
      padding:11px 12px;
      border-radius:12px;
      color:var(--muted);
      border:1px solid transparent;
    }

    .side-menu a:hover{
      background:var(--yellow-soft);
      color:var(--yellow);
      border-color:var(--yellow-line);
      transform:translateX(3px);
    }

    .side-icon{
      width:20px;
      text-align:center;
      color:var(--yellow);
      flex-shrink:0;
    }

    .topbar{
      position:relative;
      z-index:100;
      backdrop-filter:blur(4px);
      background:rgba(1,7,18,.18);
      border-bottom:none;
      overflow:visible;
    }

    .topbar-inner{
      min-height:84px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 0;
      flex-wrap:wrap;
      overflow:visible;
      position:relative;
    }

    .topbar-left{
      display:flex;
      align-items:center;
      gap:14px;
      flex:0 0 auto;
      min-width:0;
      order:1;
    }

    .menu-toggle{
      width:46px;
      height:46px;
      border-radius:14px;
      border:1px solid var(--yellow-line);
      background:var(--yellow-soft);
      color:var(--yellow);
      font-size:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .menu-toggle:hover{
      transform:translateY(-2px);
      background:var(--yellow);
      color:#08172c;
    }

    .topbar-logo{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1 1 auto;
      order:2;
    }

    .topbar-logo img{
      width:92px;
      height:92px;
      object-fit:contain;
      border:none;
      background:transparent;
      border-radius:0;
      padding:0;
      flex-shrink:0;
      filter:drop-shadow(0 5px 12px rgba(0,0,0,.45));
    }

    .logo-text{
      min-width:0;
    }

    .logo-text strong{
      display:block;
      font-size:17px;
      color:#fff;
      line-height:1.2;
    }

    .logo-text span{
      display:block;
      margin-top:4px;
      color:var(--yellow);
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
      position:relative;
      z-index:180;
      order:3;
      margin-left:auto;
    }

    .top-nav{
      width:100%;
      display:flex;
      justify-content:center;
      order:4;
      overflow:visible;
      position:relative;
      z-index:150;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }

    .top-nav::-webkit-scrollbar{
      display:none;
    }

    .top-nav ul{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:nowrap;
      justify-content:center;
      width:auto;
      min-width:0;
      padding-bottom:2px;
      overflow:visible;
      margin:0 auto;
    }

    .top-nav li{
      position:relative;
      flex:0 0 auto;
    }

    .top-nav a,
    .dropdown-toggle{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 14px;
      border-radius:12px;
      color:var(--muted);
      font-weight:600;
      border:1px solid transparent;
      background:transparent;
      white-space:nowrap;
    }

    .top-nav a:hover,
    .dropdown-toggle:hover,
    .top-nav li:hover > a{
      color:var(--yellow);
      background:var(--yellow-soft);
      border-color:var(--yellow-line);
    }

    .dropdown-toggle .fa-chevron-down{
      transition:transform .2s ease;
    }

    .dropdown.open .dropdown-toggle,
    .dropdown:hover .dropdown-toggle{
      color:var(--yellow);
      background:var(--yellow-soft);
      border-color:var(--yellow-line);
    }

    .dropdown.open .dropdown-toggle .fa-chevron-down,
    .dropdown:hover .dropdown-toggle .fa-chevron-down{
      transform:rotate(180deg);
    }

    .dropdown-menu{
      position:absolute;
      top:calc(100% + 8px);
      left:50%;
      transform:translateX(-50%);
      min-width:240px;
      background:linear-gradient(180deg, #04132d 0%, #021022 100%);
      border:1px solid var(--yellow-line);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:8px;
      display:none;
      z-index:9999;
    }

    .dropdown.open .dropdown-menu,
    .dropdown:hover .dropdown-menu{
      display:block;
    }

    .dropdown.mobile-fixed:hover .dropdown-menu{
      display:none;
    }

    .dropdown.mobile-fixed.open .dropdown-menu{
      display:block;
      position:fixed;
      left:10px !important;
      right:10px !important;
      top:120px;
      transform:none !important;
      width:auto;
      min-width:0;
      max-width:calc(100vw - 20px);
      max-height:60vh;
      overflow-y:auto;
    }

    .dropdown-menu a{
      display:flex;
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      color:var(--muted);
      border:1px solid transparent;
    }

    .dropdown-menu a:hover{
      color:var(--yellow);
      background:var(--yellow-soft);
      border-color:var(--yellow-line);
    }

    .btn-primary,
    .btn-secondary,
    .btn-login-chip{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border-radius:14px;
      transition:var(--transition);
      font-weight:700;
      cursor:pointer;
      border:1px solid transparent;
    }

    .btn-primary{
      background:linear-gradient(135deg, var(--yellow), #ffe600);
      color:#08172c;
      padding:14px 18px;
      box-shadow:0 10px 22px rgba(255,212,0,.22);
    }

    .btn-primary:hover{
      transform:translateY(-2px);
      filter:brightness(1.04);
      box-shadow:0 12px 24px rgba(255,212,0,.3);
    }

    .btn-secondary{
      padding:14px 18px;
      border:1px solid var(--yellow-line);
      color:#fff;
      background:rgba(255,255,255,.06);
    }

    .btn-secondary:hover{
      transform:translateY(-2px);
      background:var(--yellow);
      color:#08172c;
    }

    .btn-login-chip{
      padding:10px 16px;
      border:1px solid var(--yellow-line);
      background:rgba(255,212,0,.08);
      color:var(--yellow);
      white-space:nowrap;
    }

    .btn-login-chip:hover{
      background:var(--yellow);
      color:#08172c;
    }

    .login-avatar{
      width:28px;
      height:28px;
      border-radius:50%;
      background:rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      color:inherit;
      overflow:hidden;
      flex-shrink:0;
    }

    .login-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
    }

    .notification-wrap{
      position:relative;
      display:none;
    }

    .notification-btn{
      width:48px;
      height:48px;
      border-radius:16px;
      border:1px solid var(--yellow-line);
      background:rgba(255,212,0,.08);
      color:var(--yellow);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      position:relative;
    }

    .notification-btn:hover{
      background:var(--yellow);
      color:#08172c;
      transform:translateY(-2px);
    }

    .notification-count{
      position:absolute;
      top:-7px;
      right:-7px;
      min-width:20px;
      height:20px;
      padding:0 5px;
      border-radius:999px;
      background:#e30613;
      color:#fff;
      border:2px solid #04132d;
      display:none;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:900;
    }

    .notification-panel{
      position:absolute;
      top:calc(100% + 10px);
      right:0;
      width:360px;
      max-width:calc(100vw - 24px);
      background:linear-gradient(180deg,#04132d 0%,#021022 100%);
      border:1px solid var(--yellow-line);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:14px;
      display:none;
      z-index:9999;
    }

    .notification-panel.open{
      display:block;
    }

    .notification-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding-bottom:12px;
      margin-bottom:12px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .notification-head strong{
      color:#fff;
      font-size:15px;
    }

    .notification-head button{
      color:var(--yellow);
      font-size:12px;
      font-weight:900;
    }

    .notification-list{
      display:grid;
      gap:10px;
      max-height:360px;
      overflow-y:auto;
      padding-right:3px;
    }

    .notification-item{
      display:grid;
      gap:5px;
      padding:12px;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.07);
      color:var(--muted);
      text-align:left;
      width:100%;
    }

    .notification-item.nao-lida{
      border-color:var(--yellow-line);
      background:rgba(255,212,0,.08);
    }

    .notification-item strong{
      color:#fff;
      font-size:13px;
      line-height:1.25;
    }

    .notification-item span{
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .notification-item small{
      color:var(--yellow);
      font-size:11px;
      font-weight:900;
    }

    .notification-empty{
      padding:18px;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      color:var(--muted);
      text-align:center;
      font-size:13px;
      line-height:1.45;
    }

    .user-chip{
      display:none;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:16px;
      border:1px solid var(--yellow-line);
      background:rgba(255,212,0,.08);
      color:var(--yellow);
      min-height:48px;
      max-width:250px;
    }

    .user-chip:hover{
      background:var(--yellow);
      color:#08172c;
    }

    .user-chip-text{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      min-width:0;
    }

    .user-chip-text strong,
    .user-chip-text span{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:150px;
    }

    .user-chip-text strong{
      font-size:13px;
      line-height:1.2;
    }

    .user-chip-text span{
      font-size:11px;
      opacity:.9;
    }

    .apito-badge{
      color:inherit;
      font-size:13px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:18px;
      flex-shrink:0;
    }

    .user-dropdown{
      position:absolute;
      top:calc(100% + 10px);
      right:0;
      width:320px;
      max-width:calc(100vw - 24px);
      background:linear-gradient(180deg, #04132d 0%, #021022 100%);
      border:1px solid var(--yellow-line);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:14px;
      display:none;
      z-index:9999;
    }

    .user-dropdown.open{
      display:block;
    }

    .user-card-top{
      display:flex;
      align-items:center;
      gap:12px;
      padding-bottom:14px;
      border-bottom:1px solid rgba(255,255,255,.08);
      margin-bottom:14px;
    }

    .user-card-avatar{
      width:58px;
      height:58px;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      border:2px solid var(--yellow);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:var(--yellow);
      font-size:22px;
      flex-shrink:0;
    }

    .user-card-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
    }

    .user-card-info{
      min-width:0;
    }

    .user-card-info strong{
      display:block;
      color:#fff;
      font-size:16px;
      line-height:1.2;
      margin-bottom:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .user-card-info span{
      display:block;
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-bottom:4px;
    }

    .user-role{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:5px 10px;
      border-radius:999px;
      background:var(--yellow-soft);
      color:var(--yellow);
      border:1px solid var(--yellow-line);
      font-size:12px;
      font-weight:700;
    }

    .user-details{
      display:grid;
      gap:10px;
      margin-bottom:14px;
    }

    .user-detail-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      color:var(--muted);
      font-size:13px;
      border-bottom:1px solid rgba(255,255,255,.06);
      padding-bottom:8px;
    }

    .user-detail-row strong{
      color:#fff;
      font-size:13px;
      font-weight:600;
    }

    .user-menu-actions{
      display:grid;
      gap:10px;
    }

    .user-menu-actions a,
    .user-menu-actions button{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      padding:11px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      color:var(--muted);
      font-weight:700;
      text-align:left;
    }

    .user-menu-actions a:hover,
    .user-menu-actions button:hover{
      background:var(--yellow-soft);
      border-color:var(--yellow-line);
      color:var(--yellow);
    }

    .hero{
      padding:24px 0 20px;
      position:relative;
      z-index:1;
    }

    .hero-card{
      background:rgba(1,7,18,.16);
      border:none;
      border-radius:0;
      box-shadow:none;
      overflow:visible;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:34px;
      align-items:center;
      min-height:520px;
      padding:58px 44px 44px;
      position:relative;
      z-index:2;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,212,0,.12);
      border:1px solid var(--yellow-line);
      color:var(--yellow);
      font-size:13px;
      font-weight:700;
      margin-bottom:16px;
    }

    .hero h1{
      font-size:52px;
      line-height:1.08;
      margin-bottom:18px;
      color:var(--yellow);
      text-shadow:0 5px 18px rgba(0,0,0,.65);
    }

    .hero p{
      color:#ffffff;
      font-size:18px;
      line-height:1.7;
      max-width:760px;
      text-shadow:0 4px 12px rgba(0,0,0,.72);
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-top:26px;
    }

    .hero-art img{
      width:100%;
      height:auto;
      max-height:500px;
      object-fit:contain;
      border-radius:0;
      border:none;
      box-shadow:none;
      filter:drop-shadow(0 18px 26px rgba(0,0,0,.55));
    }

    .cards-pilares{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:18px;
      margin:28px 0 10px;
    }

    .pillar{
      background:linear-gradient(180deg, rgba(7,24,59,.94), rgba(3,17,45,.96));
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:22px 18px;
      display:flex;
      gap:14px;
      align-items:flex-start;
      box-shadow:var(--shadow);
      transition:var(--transition);
    }

    .pillar:hover{
      border-color:var(--yellow-line);
      transform:translateY(-2px);
    }

    .pillar-icon{
      width:52px;
      height:52px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--yellow-soft);
      color:var(--yellow);
      font-size:22px;
      flex-shrink:0;
    }

    .pillar-text h3{
      font-size:18px;
      margin-bottom:8px;
      color:#fff;
    }

    .pillar-text p{
      font-size:14px;
      line-height:1.6;
      color:var(--muted);
    }

    .content-grid{
      display:grid;
      grid-template-columns:1.3fr .9fr;
      gap:22px;
      margin:28px 0;
    }

    .panel{
      background:linear-gradient(180deg, rgba(7,24,59,.94), rgba(3,17,45,.96));
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      box-shadow:var(--shadow);
