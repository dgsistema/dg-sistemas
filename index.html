<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DG Sistemas - Súmulas</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --gold:#ffd400;
  --gold-2:#ffe600;
  --gold-soft:rgba(255,212,0,.12);
  --gold-line:rgba(255,212,0,.3);
  --white:#fff;
  --muted:#d8e1ef;
  --text-soft:#a8b6cf;
  --azul:#061d44;
  --azul2:#08285c;
  --verde:#069447;
  --vermelho:#e30613;
  --shadow:0 12px 30px rgba(0,0,0,.4);
  --transition:.25s ease;
  --max:1200px;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;overflow-x:hidden;}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(rgba(1,7,18,.5), rgba(1,7,18,.7)),
    url("fundo.png") center center / cover no-repeat fixed;
  color:var(--white);
  min-height:100vh;
}

a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;transition:var(--transition);}
img{max-width:100%;display:block;}

.wrap{width:min(100% - 32px, var(--max));margin:0 auto;}

/* ===== HEADER ===== */
.header{
  background:rgba(2,6,15,.9);
  border-bottom:2px solid var(--gold);
  padding:14px 0;
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(8px);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{
  width:56px;height:56px;object-fit:contain;
  filter:drop-shadow(0 4px 10px rgba(255,212,0,.35));
}
.brand-text strong{
  display:block;color:var(--gold);font-size:18px;
  letter-spacing:1.5px;font-weight:900;line-height:1.1;
}
.brand-text span{
  display:block;color:var(--muted);font-size:11px;margin-top:3px;
}
.btn-nova{
  display:inline-flex;align-items:center;gap:9px;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:#08172c;padding:12px 22px;border-radius:12px;
  font-weight:900;font-size:14px;
  box-shadow:0 8px 20px rgba(255,212,0,.3);
}
.btn-nova:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(255,212,0,.45);}

/* ===== CONTAINER ===== */
.container{padding:28px 0 40px;}
.page-title{
  display:flex;align-items:center;gap:12px;
  margin-bottom:22px;flex-wrap:wrap;
}
.page-title h1{
  font-size:26px;font-weight:900;color:#fff;
}
.page-title .badge{
  background:var(--gold-soft);border:1px solid var(--gold-line);
  color:var(--gold);padding:5px 12px;border-radius:999px;
  font-size:12px;font-weight:900;
}

/* ===== LISTA ===== */
.lista{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:14px;
}
.card{
  background:linear-gradient(180deg, rgba(7,24,59,.95), rgba(3,17,45,.97));
  border:1px solid rgba(255,212,0,.2);
  border-radius:16px;padding:16px;
  box-shadow:var(--shadow);transition:var(--transition);
  cursor:pointer;position:relative;overflow:hidden;
}
.card:hover{
  border-color:var(--gold);
  transform:translateY(-3px);
  box-shadow:0 15px 35px rgba(255,212,0,.15);
}
.card-status{
  position:absolute;top:12px;right:12px;
  background:var(--verde);color:#fff;
  font-size:10px;font-weight:900;
  padding:4px 9px;border-radius:999px;
}
.card-times{
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:10px;align-items:center;margin:14px 0;
}
.card-time{
  text-align:center;
}
.card-time strong{
  display:block;color:#fff;font-size:14px;font-weight:900;
  line-height:1.2;word-break:break-word;
}
.card-placar{
  background:var(--azul);color:var(--gold);
  padding:8px 14px;border-radius:10px;
  font-size:18px;font-weight:900;white-space:nowrap;
  border:1px solid var(--gold-line);
}
.card-info{
  font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px;
}
.card-info strong{color:#fff;}
.card-info i{color:var(--gold);width:14px;}

.card-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.btn-ver,.btn-wpp{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 8px;border-radius:9px;
  font-weight:900;font-size:12px;
}
.btn-ver{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#08172c;}
.btn-ver:hover{transform:translateY(-2px);}
.btn-wpp{background:#25d366;color:#fff;}
.btn-wpp:hover{background:#1ebe5b;}

.vazio{
  grid-column:1/-1;
  text-align:center;padding:60px 20px;
  background:rgba(7,24,59,.7);
  border:2px dashed rgba(255,212,0,.25);
  border-radius:20px;
}
.vazio i{font-size:56px;color:var(--gold);opacity:.5;margin-bottom:16px;}
.vazio h2{font-size:22px;color:#fff;margin-bottom:8px;font-weight:900;}
.vazio p{color:var(--muted);font-size:14px;margin-bottom:20px;}

/* ===== FORMULÁRIO SÚMULA ===== */
.form-sumula{display:none;}
.form-sumula.on{display:block;}
.lista.on{display:none;}

.form-topo{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:20px;
}
.btn-voltar{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:#fff;padding:10px 16px;border-radius:10px;
  font-weight:800;font-size:13px;
}
.btn-voltar:hover{background:rgba(255,255,255,.15);}

.card-form{
  background:linear-gradient(180deg, rgba(7,24,59,.95), rgba(3,17,45,.97));
  border:1px solid rgba(255,212,0,.2);
  border-radius:16px;padding:20px;margin-bottom:16px;
  box-shadow:var(--shadow);
}
.card-form h3{
  display:flex;align-items:center;gap:10px;
  color:var(--gold);font-size:16px;font-weight:900;
  text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid rgba(255,212,0,.15);
}
.card-form h3 i{
  width:32px;height:32px;border-radius:9px;
  background:var(--gold-soft);border:1px solid var(--gold-line);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
}

.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.grid.g3{grid-template-columns:1fr 1fr 1fr;}
.grid.full{grid-template-columns:1fr;}
.campo{display:flex;flex-direction:column;}
.campo label{
  color:var(--muted);font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;
}
.campo input,.campo select,.campo textarea{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;padding:11px 13px;border-radius:9px;
  font-size:14px;font-family:inherit;outline:none;
  transition:var(--transition);
}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  border-color:var(--gold);
  background:rgba(255,212,0,.06);
  box-shadow:0 0 0 3px rgba(255,212,0,.1);
}
.campo input::placeholder,.campo textarea::placeholder{color:var(--text-soft);}
.campo textarea{min-height:80px;resize:vertical;font-family:inherit;}

/* tabelas de jogadores */
.tabela-jogadores{width:100%;border-collapse:collapse;margin-top:10px;}
.tabela-jogadores th{
  background:rgba(255,212,0,.08);color:var(--gold);
  font-size:11px;text-transform:uppercase;
  padding:8px 6px;text-align:left;font-weight:900;
  border-bottom:1px solid var(--gold-line);
}
.tabela-jogadores td{
  padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.06);
}
.tabela-jogadores input{
  width:100%;padding:7px 8px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;border-radius:7px;font-size:13px;
}
.tabela-jogadores .num{width:52px;}
.tabela-jogadores .pos{width:120px;}
.tabela-jogadores .acao{width:36px;text-align:center;}

.btn-add-linha,.btn-remover{
  padding:7px 11px;border-radius:8px;font-weight:900;font-size:12px;
}
.btn-add-linha{
  background:rgba(255,212,0,.15);color:var(--gold);
  border:1px solid var(--gold-line);margin-top:10px;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-add-linha:hover{background:var(--gold);color:#08172c;}
.btn-remover{background:rgba(227,6,19,.2);color:#ff6b6b;}
.btn-remover:hover{background:var(--vermelho);color:#fff;}

/* ===== BOTÕES DE AÇÃO FINAL ===== */
.botoes-final{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  margin-top:24px;
}
.btn-final{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:18px 10px;border-radius:14px;
  font-weight:900;font-size:13px;text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
}
.btn-final i{font-size:24px;}
.btn-final:hover{transform:translateY(-3px);}
.btn-salvar{background:linear-gradient(135deg,var(--verde),#0aa956);color:#fff;}
.btn-pdf{background:linear-gradient(135deg,var(--vermelho),#c4121e);color:#fff;}
.btn-whats{background:linear-gradient(135deg,#25d366,#1ebe5b);color:#fff;}

/* ===== ALERTA ===== */
.alerta{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--verde);color:#fff;padding:14px 24px;
  border-radius:12px;font-weight:900;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  z-index:9999;opacity:0;pointer-events:none;
  transition:var(--transition);
}
.alerta.show{opacity:1;}
.alerta.erro{background:var(--vermelho);}

@media (max-width:700px){
  .grid,.grid.g3{grid-template-columns:1fr;}
  .botoes-final{grid-template-columns:1fr;}
  .brand img{width:44px;height:44px;}
  .brand-text strong{font-size:14px;}
  .brand-text span{font-size:10px;}
  .btn-nova{padding:10px 16px;font-size:12px;}
  .page-title h1{font-size:20px;}
  .card-placar{font-size:16px;padding:6px 10px;}
}
</style>
</head>

<body>

<header class="header">
  <div class="wrap header-inner">
    <div class="brand">
      <img src="logo.png" alt="DG Sistemas">
      <div class="brand-text">
        <strong>DG SISTEMAS</strong>
        <span>Súmula digital</span>
      </div>
    </div>
    <button class="btn-nova" onclick="novaSumula()">
      <i class="fa-solid fa-plus"></i> Nova Súmula
    </button>
  </div>
</header>

<main class="wrap container">

  <!-- ===== LISTA DE SÚMULAS ===== -->
  <div id="lista" class="lista-area">
    <div class="page-title">
      <h1>Minhas Súmulas</h1>
      <span class="badge" id="contador">0 salvas</span>
    </div>
    <div id="listaCards" class="lista"></div>
  </div>

  <!-- ===== FORMULÁRIO ===== -->
  <div id="form" class="form-sumula">
    <div class="form-topo">
      <button class="btn-voltar" onclick="voltarLista()">
        <i class="fa-solid fa-arrow-left"></i> Voltar
      </button>
      <h2 style="color:#fff;font-size:20px;font-weight:900;">Nova Súmula</h2>
    </div>

    <!-- Dados do jogo -->
    <div class="card-form">
      <h3><i class="fa-solid fa-calendar"></i> Dados do Jogo</h3>
      <div class="grid">
        <div class="campo">
          <label>Competição</label>
          <input id="competicao" placeholder="Ex: Campeonato Goiano">
        </div>
        <div class="campo">
          <label>Categoria</label>
          <input id="categoria" placeholder="Ex: Sub-15">
        </div>
        <div class="campo">
          <label>Data</label>
          <input id="data" type="date">
        </div>
        <div class="campo">
          <label>Hora</label>
          <input id="hora" type="time">
        </div>
        <div class="campo" style="grid-column:1/-1;">
          <label>Local / Campo</label>
          <input id="local" placeholder="Ex: Estádio Municipal">
        </div>
      </div>
    </div>

    <!-- Times -->
    <div class="card-form">
      <h3><i class="fa-solid fa-shield-halved"></i> Times e Placar</h3>
      <div class="grid g3">
        <div class="campo">
          <label>Time da Casa</label>
          <input id="timeA" placeholder="Nome do time">
        </div>
        <div class="campo">
          <label>Placar</label>
          <input id="placar" placeholder="Ex: 2 x 1">
        </div>
        <div class="campo">
          <label>Time Visitante</label>
          <input id="timeB" placeholder="Nome do time">
        </div>
      </div>
    </div>

    <!-- Arbitragem -->
    <div class="card-form">
      <h3><i class="fa-solid fa-whistle"></i> Arbitragem</h3>
      <div class="grid g3">
        <div class="campo">
          <label>Árbitro</label>
          <input id="arbitro" placeholder="Seu nome">
        </div>
        <div class="campo">
          <label>Assistente 1</label>
          <input id="ass1" placeholder="Nome">
        </div>
        <div class="campo">
          <label>Assistente 2</label>
          <input id="ass2" placeholder="Nome">
        </div>
      </div>
    </div>

    <!-- Gols -->
    <div class="card-form">
      <h3><i class="fa-solid fa-futbol"></i> Gols</h3>
      <table class="tabela-jogadores" id="tabelaGols">
        <thead>
          <tr>
            <th class="num">Min</th>
            <th>Jogador</th>
            <th class="pos">Time</th>
            <th class="acao"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="btn-add-linha" onclick="addGol()">
        <i class="fa-solid fa-plus"></i> Adicionar gol
      </button>
    </div>

    <!-- Cartões -->
    <div class="card-form">
      <h3><i class="fa-solid fa-id-card"></i> Cartões</h3>
      <table class="tabela-jogadores" id="tabelaCartoes">
        <thead>
          <tr>
            <th class="num">Min</th>
            <th>Jogador</th>
            <th class="pos">Time</th>
            <th class="pos">Tipo</th>
            <th class="acao"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="btn-add-linha" onclick="addCartao()">
        <i class="fa-solid fa-plus"></i> Adicionar cartão
      </button>
    </div>

    <!-- Observações -->
    <div class="card-form">
      <h3><i class="fa-solid fa-pen"></i> Observações</h3>
      <div class="campo">
        <textarea id="observacoes" placeholder="Ocorrências, lesões, etc."></textarea>
      </div>
    </div>

    <!-- Botões finais -->
    <div class="botoes-final">
      <button class="btn-final btn-salvar" onclick="salvarSumula()">
        <i class="fa-solid fa-floppy-disk"></i> Salvar Súmula
      </button>
      <button class="btn-final btn-pdf" onclick="gerarPDF()">
        <i class="fa-solid fa-file-pdf"></i> Salvar PDF
      </button>
      <button class="btn-final btn-whats" onclick="enviarWhats()">
        <i class="fa-brands fa-whatsapp"></i> Enviar WhatsApp
      </button>
    </div>
  </div>

</main>

<div id="alerta" class="alerta"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const STORAGE_KEY = "dg_sumulas";
let sumulaAtual = null;

function $(id){ return document.getElementById(id); }

function mostrarAlerta(msg, tipo){
  const a = $("alerta");
  a.textContent = msg;
  a.className = "alerta show" + (tipo === "erro" ? " erro" : "");
  setTimeout(()=>{ a.className = "alerta"; }, 3000);
}

/* ===== LISTA ===== */
function getSumulas(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch(e){ return []; }
}
function setSumulas(lista){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
}

function renderLista(){
  const lista = getSumulas().sort((a,b) => (b.criadoEm||0) - (a.criadoEm||0));
  $("contador").textContent = lista.length + " salva" + (lista.length === 1 ? "" : "s");

  if(!lista.length){
    $("listaCards").innerHTML = `
      <div class="vazio">
        <i class="fa-solid fa-file-signature"></i>
        <h2>Nenhuma súmula salva ainda</h2>
        <p>Clique em <strong>Nova Súmula</strong> pra começar.</p>
        <button class="btn-nova" onclick="novaSumula()">
          <i class="fa-solid fa-plus"></i> Nova Súmula
        </button>
      </div>
    `;
    return;
  }

  $("listaCards").innerHTML = lista.map(s => {
    const dataBR = s.data ? s.data.split("-").reverse().join("/") : "-";
    return `
      <div class="card" onclick="abrirSumula('${s.id}')">
        <div class="card-status">Finalizada</div>
        <div class="card-times">
          <div class="card-time"><strong>${s.timeA || "Time A"}</strong></div>
          <div class="card-placar">${s.placar || "0 x 0"}</div>
          <div class="card-time"><strong>${s.timeB || "Time B"}</strong></div>
        </div>
        <div class="card-info">
          <i class="fa-solid fa-trophy"></i> <strong>${s.competicao || "Competição"}</strong><br>
          <i class="fa-solid fa-calendar"></i> ${dataBR} ${s.hora || ""}<br>
          <i class="fa-solid fa-location-dot"></i> ${s.local || "-"}
        </div>
        <div class="card-actions">
          <button class="btn-ver" onclick="event.stopPropagation();abrirSumula('${s.id}')">
            <i class="fa-solid fa-eye"></i> Ver
          </button>
          <button class="btn-wpp" onclick="event.stopPropagation();wppRapido('${s.id}')">
            <i class="fa-brands fa-whatsapp"></i> Enviar
          </button>
        </div>
      </div>
    `;
  }).join("");
}

/* ===== NAVEGAÇÃO ===== */
function novaSumula(){
  sumulaAtual = { id: "sum_" + Date.now(), criadoEm: Date.now(), gols: [], cartoes: [] };
  limparFormulario();
  $("lista").style.display = "none";
  $("form").classList.add("on");
}

function voltarLista(){
  $("form").classList.remove("on");
  $("lista").style.display = "block";
  renderLista();
}

function abrirSumula(id){
  const s = getSumulas().find(x => x.id === id);
  if(!s) return;
  sumulaAtual = JSON.parse(JSON.stringify(s));
  preencherFormulario(s);
  $("lista").style.display = "none";
  $("form").classList.add("on");
}

/* ===== FORMULÁRIO ===== */
function limparFormulario(){
  ["competicao","categoria","data","hora","local","timeA","placar","timeB","arbitro","ass1","ass2","observacoes"]
    .forEach(id => $(id).value = "");
  $("tabelaGols").querySelector("tbody").innerHTML = "";
  $("tabelaCartoes").querySelector("tbody").innerHTML = "";
}

function preencherFormulario(s){
  $("competicao").value = s.competicao || "";
  $("categoria").value = s.categoria || "";
  $("data").value = s.data || "";
  $("hora").value = s.hora || "";
  $("local").value = s.local || "";
  $("timeA").value = s.timeA || "";
  $("placar").value = s.placar || "";
  $("timeB").value = s.timeB || "";
  $("arbitro").value = s.arbitro || "";
  $("ass1").value = s.ass1 || "";
  $("ass2").value = s.ass2 || "";
  $("observacoes").value = s.observacoes || "";

  const tbodyG = $("tabelaGols").querySelector("tbody");
  tbodyG.innerHTML = "";
  (s.gols || []).forEach(g => addLinhaGol(g));

  const tbodyC = $("tabelaCartoes").querySelector("tbody");
  tbodyC.innerHTML = "";
  (s.cartoes || []).forEach(c => addLinhaCartao(c));
}

/* ===== GOLS E CARTÕES ===== */
function addGol(dados){
  dados = dados || {};
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="num"><input value="${dados.min || ''}" placeholder="12"></td>
    <td><input value="${dados.jogador || ''}" placeholder="Nome do jogador"></td>
    <td class="pos">
      <select style="width:100%;padding:7px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:7px;font-size:13px;">
        <option value="Casa" ${dados.time === 'Casa' ? 'selected' : ''}>Casa</option>
        <option value="Visitante" ${dados.time === 'Visitante' ? 'selected' : ''}>Visitante</option>
      </select>
    </td>
    <td class="acao"><button class="btn-remover" onclick="this.closest('tr').remove()">×</button></td>
  `;
  $("tabelaGols").querySelector("tbody").appendChild(tr);
}

function addCartao(dados){
  dados = dados || {};
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="num"><input value="${dados.min || ''}" placeholder="18"></td>
    <td><input value="${dados.jogador || ''}" placeholder="Nome do jogador"></td>
    <td class="pos">
      <select style="width:100%;padding:7px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:7px;font-size:13px;">
        <option value="Casa" ${dados.time === 'Casa' ? 'selected' : ''}>Casa</option>
        <option value="Visitante" ${dados.time === 'Visitante' ? 'selected' : ''}>Visitante</option>
      </select>
    </td>
    <td class="pos">
      <select style="width:100%;padding:7px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:7px;font-size:13px;">
        <option value="🟨 Amarelo" ${dados.tipo === '🟨 Amarelo' ? 'selected' : ''}>🟨 Amarelo</option>
        <option value="🟥 Vermelho" ${dados.tipo === '🟥 Vermelho' ? 'selected' : ''}>🟥 Vermelho</option>
      </select>
    </td>
    <td class="acao"><button class="btn-remover" onclick="this.closest('tr').remove()">×</button></td>
  `;
  $("tabelaCartoes").querySelector("tbody").appendChild(tr);
}

function coletarTabela(tabelaId){
  const linhas = [];
  document.querySelectorAll(`#${tabelaId} tbody tr`).forEach(tr => {
    const inputs = tr.querySelectorAll("input");
    const selects = tr.querySelectorAll("select");
    linhas.push({
      min: inputs[0].value,
      jogador: inputs[1].value,
      time: selects[0] ? selects[0].value : "",
      tipo: selects[1] ? selects[1].value : ""
    });
  });
  return linhas.filter(l => l.jogador || l.min);
}

/* ===== COLETAR DADOS ===== */
function coletarDados(){
  return {
    id: sumulaAtual.id,
    criadoEm: sumulaAtual.criadoEm,
    competicao: $("competicao").value.trim(),
    categoria: $("categoria").value.trim(),
    data: $("data").value,
    hora: $("hora").value,
    local: $("local").value.trim(),
    timeA: $("timeA").value.trim(),
    placar: $("placar").value.trim(),
    timeB: $("timeB").value.trim(),
    arbitro: $("arbitro").value.trim(),
    ass1: $("ass1").value.trim(),
    ass2: $("ass2").value.trim(),
    gols: coletarTabela("tabelaGols"),
    cartoes: coletarTabela("tabelaCartoes"),
    observacoes: $("observacoes").value.trim()
  };
}

/* ===== SALVAR ===== */
function salvarSumula(){
  const dados = coletarDados();
  if(!dados.timeA || !dados.timeB){
    mostrarAlerta("Preencha o nome dos dois times.", "erro");
    return;
  }
  const lista = getSumulas();
  const idx = lista.findIndex(s => s.id === dados.id);
  if(idx >= 0) lista[idx] = dados;
  else lista.push(dados);
  setSumulas(lista);
  sumulaAtual = dados;
  mostrarAlerta("Súmula salva com sucesso!");
}

/* ===== WHATSAPP ===== */
function textoWhats(dados){
  const dataBR = dados.data ? dados.data.split("-").reverse().join("/") : "-";
  let t = `*📋 SÚMULA OFICIAL*\n`;
  t += `_DG Sistemas_\n\n`;
  t += `🏆 *${dados.competicao || "Competição"}*\n`;
  t += `📂 ${dados.categoria || "-"}\n`;
  t += `📅 ${dataBR} às ${dados.hora || "--:--"}\n`;
  t += `📍 ${dados.local || "-"}\n\n`;
  t += `⚽ *${dados.timeA}* ${dados.placar || "0 x 0"} *${dados.timeB}*\n\n`;

  if(dados.gols.length){
    t += `*GOLS*\n`;
    dados.gols.forEach(g => {
      t += `⚽ ${g.min}' - ${g.jogador} (${g.time})\n`;
    });
    t += `\n`;
  }

  if(dados.cartoes.length){
    t += `*CARTÕES*\n`;
    dados.cartoes.forEach(c => {
      t += `${c.tipo} ${c.min}' - ${c.jogador} (${c.time})\n`;
    });
    t += `\n`;
  }

  t += `*ARBITRAGEM*\n`;
  t += `👨‍⚖️ ${dados.arbitro || "-"}\n`;
  t += `🚩 ${dados.ass1 || "-"}\n`;
  t += `🚩 ${dados.ass2 || "-"}\n`;

  if(dados.observacoes){
    t += `\n*OBSERVAÇÕES*\n${dados.observacoes}\n`;
  }

  return t;
}

function enviarWhats(){
  const dados = coletarDados();
  if(!dados.timeA || !dados.timeB){
    mostrarAlerta("Preencha o nome dos dois times.", "erro");
    return;
  }
  salvarSumula();
  const texto = encodeURIComponent(textoWhats(dados));
  window.open("https://wa.me/?text=" + texto, "_blank");
}

function wppRapido(id){
  const s = getSumulas().find(x => x.id === id);
  if(!s) return;
  const texto = encodeURIComponent(textoWhats(s));
  window.open("https://wa.me/?text=" + texto, "_blank");
}
