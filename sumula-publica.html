<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Súmula Oficial - DG Sistemas</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--azul:#061d44;--azul2:#08285c;--verde:#069447;--dourado:#f7c600;--linha:#cfd7e3;--texto:#071833;--muted:#4b5563;--bg:#dfe6ef}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--texto)}
button{font-family:inherit;cursor:pointer;border:none;transition:.2s}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

.topo-nav{
  background:linear-gradient(135deg,var(--azul),var(--azul2));
  border-bottom:4px solid var(--dourado);
  padding:12px 18px;position:sticky;top:0;z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.topo-inner{
  max-width:1120px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;
}
.topo-marca{display:flex;align-items:center;gap:12px}
.topo-marca img{width:46px;height:46px;object-fit:contain}
.topo-marca strong{color:var(--dourado);font-size:16px;font-weight:900;letter-spacing:1.2px;display:block}
.topo-marca span{color:#cbd6ea;font-size:11px;display:block;margin-top:2px}

.topo-acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn-top{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 14px;border-radius:9px;font-weight:900;font-size:13px;
}
.btn-top-voltar{background:rgba(255,255,255,.15);color:#fff}
.btn-top-voltar:hover{background:rgba(255,255,255,.25)}
.btn-top-pdf{background:#dc2626;color:#fff}
.btn-top-pdf:hover{background:#b91c1c}
.btn-top-wpp{background:#25d366;color:#fff}
.btn-top-wpp:hover{background:#1ebe5b}

.aviso-autenticada{
  background:linear-gradient(135deg,var(--verde),#0aa956);
  color:#fff;text-align:center;padding:14px 20px;
  border-bottom:4px solid var(--dourado);
}
.aviso-autenticada i{font-size:20px;margin-right:8px}
.aviso-autenticada strong{font-size:16px;font-weight:900;letter-spacing:.5px}
.aviso-autenticada p{font-size:12px;margin-top:4px;opacity:.95}

.loading,.erro{
  max-width:600px;margin:80px auto;text-align:center;
  background:#fff;border-radius:16px;padding:40px 20px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
}
.loading i,.erro i{font-size:48px;color:var(--azul);margin-bottom:14px;display:block}
.erro i{color:#dc2626}
.loading p,.erro p{color:var(--muted);font-size:15px;font-weight:900}
.erro h2{color:#dc2626;font-size:20px;font-weight:900;margin-bottom:8px}

/* SÚMULA */
.sumula-viewport{width:100%;overflow:hidden;display:flex;justify-content:center;padding:14px 8px}
.sumula-scale{width:1120px;max-width:1120px;transform-origin:top center}
.sumula-page{width:1120px;max-width:1120px;margin:0 auto;background:#fff;border:1px solid #b9c4d4;border-radius:7px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.16)}

.header{display:grid;grid-template-columns:145px 1.35fr 145px 260px;align-items:center;gap:14px;padding:16px 22px 18px;background:radial-gradient(circle at top left,rgba(255,255,255,.10),transparent 32%),linear-gradient(135deg,#041b40 0%,#06265a 55%,#061d44 100%);color:#fff;border-bottom:4px solid var(--dourado);position:relative;overflow:hidden}
.header:after{content:"";position:absolute;right:-70px;bottom:-28px;width:310px;height:70px;border-top:5px solid var(--dourado);transform:rotate(-12deg);opacity:.95}
.header-logo,.header-campeonato-logo{display:flex;justify-content:center;align-items:center;position:relative;z-index:1}
.header-logo img{width:105px;height:105px;object-fit:contain}
.header-campeonato-logo img{width:104px;height:104px;object-fit:contain;border-radius:16px}
.header-title{text-align:left;position:relative;z-index:1}
.header-title h1{color:#fff;font-size:54px;white-space:nowrap;font-weight:900;letter-spacing:1px;line-height:.95;text-transform:uppercase}
.header-title p{margin-top:8px;color:var(--dourado);font-size:20px;font-weight:900;text-transform:uppercase}
.header-title span{display:block;margin-top:6px;color:#fff;font-size:14px;font-weight:900;text-transform:uppercase}
.header-right{text-align:left;color:#fff;font-weight:900;line-height:1.12;text-transform:uppercase;position:relative;z-index:1}
.header-right .liga-nome{font-size:20px}
.header-right .liga-slogan{margin-top:8px;color:var(--dourado);font-size:16px;font-weight:900}

.info-strip{margin:10px 16px 12px;display:grid;grid-template-columns:1.1fr 1.45fr .86fr .72fr 1.05fr;border:1px solid var(--linha);border-radius:5px;overflow:hidden}
.info-box{min-height:70px;display:flex;align-items:center;gap:12px;padding:9px 12px;border-right:1px solid var(--linha);background:#fff}
.info-box:last-child{border-right:none}
.info-box i{width:36px;color:var(--azul);font-size:30px;text-align:center;flex-shrink:0}
.info-box small{display:block;font-size:12px;font-weight:900;text-transform:uppercase;color:#111;margin-bottom:4px}
.info-box strong{display:block;color:var(--azul);font-size:17px;font-weight:900}

.status-finalizado{display:inline-flex!important;align-items:center;justify-content:center;gap:7px;background:var(--verde);color:#fff!important;padding:8px 15px;border-radius:8px;font-size:15px!important;font-weight:900}
.status-finalizado i{color:#fff!important;font-size:18px!important;width:auto!important}

.score-card{margin:0 16px 12px;display:grid;grid-template-columns:1fr 250px 1fr;min-height:132px;border:1px solid var(--linha);border-radius:5px;overflow:hidden}
.team-score{display:flex;align-items:center;justify-content:center;gap:18px;padding:13px;background:#fff}
.team-score.away{flex-direction:row-reverse}
.team-name{text-align:center;flex:1}
.team-name h2{color:var(--azul);font-size:31px;font-weight:900;text-transform:uppercase;line-height:1.05}
.score-center{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--linha);border-right:1px solid var(--linha)}
.score-number{font-size:74px;font-weight:900;letter-spacing:5px;line-height:1}
.score-center span{margin-top:8px;text-transform:uppercase;font-size:14px;font-weight:900}

.match-strip{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr 1.35fr 1.1fr;border:1px solid var(--linha);border-radius:5px;overflow:hidden}
.match-box{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border-right:1px solid var(--linha);background:#fff}
.match-box:last-child{border-right:none}
.match-box i{width:34px;color:var(--azul);font-size:30px;text-align:center}
.match-box small{display:block;color:var(--azul);text-transform:uppercase;font-weight:900;font-size:12px;margin-bottom:3px}
.match-box strong{display:block;color:#111;font-size:15px;font-weight:900}

.section-title{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;text-align:center;padding:8px 10px;font-size:20px;font-weight:900;text-transform:uppercase;border-radius:5px 5px 0 0}
.line-empty{color:#777;font-size:13px;text-align:center;padding:12px}
.lineups,.comissao{margin:0 16px 12px}
.lineups-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lineup-card{border:1px solid var(--linha);border-radius:0 0 5px 5px;overflow:hidden;background:#fff}
.lineup-head{height:40px;display:flex;align-items:center;justify-content:center;color:var(--azul);background:#fff;border-bottom:1px solid var(--linha);font-size:20px;font-weight:900;text-transform:uppercase}
.table{width:100%;border-collapse:collapse}
.table th{background:#f5f7fb;color:var(--azul);font-size:12px;text-transform:uppercase;padding:7px 8px;border-bottom:1px solid var(--linha);text-align:left}
.table td{color:#111;font-size:13px;padding:5px 8px;border-bottom:1px solid #e5eaf1}
.table tr:last-child td{border-bottom:none}
.table .num{width:48px;text-align:center}
.table .posicao{width:160px}

.comissao-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--linha);border-top:none;border-radius:0 0 5px 5px;overflow:hidden;background:#fff}
.comissao-card{padding:12px;border-right:1px solid var(--linha)}
.comissao-card:last-child{border-right:none}
.comissao-head{display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:18px;font-weight:900;text-transform:uppercase;margin-bottom:10px}
.comissao-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.comissao-item{min-height:72px;display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid #dbe3ef;border-radius:12px;background:linear-gradient(180deg,#fff,#f8fafc)}
.comissao-icone{width:36px;height:36px;border-radius:50%;background:#eaf2ff;color:var(--azul);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid #d7e2f0}
.comissao-info small{display:block;color:var(--azul);font-size:10px;font-weight:900;text-transform:uppercase;margin-bottom:4px}
.comissao-info strong{display:block;color:#111;font-size:13px;line-height:1.25}
.comissao-vazio{grid-column:1/-1;color:#777;font-size:13px;text-align:center;padding:12px}

.events-grid{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.team-events{border:1px solid var(--linha);border-radius:5px;overflow:hidden;background:#fff}
.team-events h3{color:#fff;background:linear-gradient(135deg,var(--azul),var(--azul2));text-align:center;padding:8px;font-size:20px;font-weight:900;text-transform:uppercase}
.events-columns{display:grid;grid-template-columns:1fr 1fr}
.event-col{min-height:130px;padding:12px;border-right:1px solid var(--linha)}
.event-col:last-child{border-right:none}
.event-col h4{color:var(--azul);text-align:center;font-size:17px;font-weight:900;text-transform:uppercase;margin-bottom:10px}
.event-item{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#111;font-size:14px;line-height:1.2}
.event-minute{color:var(--azul);font-weight:900;width:42px;flex:0 0 auto}
.event-name{flex:1}
.ball{font-size:18px;width:20px;text-align:center}
.yellow-card,.red-card{width:14px;height:19px;border-radius:3px;display:inline-block;flex:0 0 auto}
.yellow-card{background:#f7c600}
.red-card{background:#e30613}

.lower-grid{margin:0 16px 12px;display:grid;grid-template-columns:.8fr 1.35fr;gap:24px}
.panel{border:1px solid var(--linha);border-radius:5px;overflow:hidden;background:#fff}
.panel h3{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;text-align:center;padding:8px;font-size:18px;font-weight:900;text-transform:uppercase}
.official-row{display:grid;grid-template-columns:165px 1fr;min-height:44px;border-bottom:1px solid var(--linha);align-items:center}
.official-row:last-child{border-bottom:none}
.official-label{display:flex;align-items:center;gap:10px;color:var(--azul);font-size:13px;font-weight:900;text-transform:uppercase;padding:10px 12px}
.official-value{color:#111;font-size:14px;padding:10px 12px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--linha)}
.summary-box{text-align:center;padding:15px 10px;border-right:1px solid var(--linha)}
.summary-box:last-child{border-right:none}
.summary-box i{color:var(--azul);font-size:28px;margin-bottom:6px}
.summary-box span{display:block;color:var(--azul);font-size:12px;font-weight:900;text-transform:uppercase}
.summary-box strong{display:block;color:var(--azul);font-size:31px;font-weight:900;margin-top:4px}
.summary-detail{color:#111;font-size:12px;margin-top:2px}
.summary-card-icon{margin:0 auto 7px;width:18px;height:24px;border-radius:3px}
.best-player{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:12px;padding:12px}
.best-player h4{color:var(--azul);font-size:14px;font-weight:900;text-transform:uppercase;margin-bottom:8px}
.best-player strong{display:block;color:#111;font-size:18px;font-weight:900}
.best-player span{display:block;color:var(--azul);font-size:13px;margin-top:4px}
.trophy{text-align:center;font-size:58px}

.footer-grid{margin:0 16px;display:grid;grid-template-columns:.8fr 1.35fr;gap:24px}
.auth-box{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:12px}
.auth-box img{width:98px;height:98px}
.auth-text strong{display:block;color:var(--azul);font-size:14px;font-weight:900;text-transform:uppercase}
.auth-text p{color:#111;font-size:12px;line-height:1.35}
.auth-code{color:var(--azul);font-size:17px;font-weight:900;margin:4px 0}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px}
.btn{min-height:58px;border-radius:8px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:13px;padding:10px}
.btn i{font-size:24px}
.btn-whats{background:#0ca84a}
.btn-email{background:#2563eb}
.btn-link{background:#4b5563}
.btn-pdf{background:#dc2626}
.final-footer{margin-top:12px;background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;text-align:center;padding:9px;font-size:13px;line-height:1.35}
.patrocinio-sumula{width:100%;background:#061d44;margin:0;padding:10px 16px;border-top:4px solid var(--dourado)}
.patrocinio-sumula img{width:100%;max-height:150px;object-fit:contain;margin:0 auto}

@media(max-width:900px){
  .topo-marca span{display:none}
  .sumula-viewport{justify-content:flex-start;align-items:flex-start;padding:8px 0}
  .sumula-scale{transform:scale(var(--escala-mobile,1));transform-origin:top left}
  .sumula-page{border-radius:0;box-shadow:none}
  .header-title h1{font-size:52px;white-space:nowrap}
}
@media print{
  @page{size:A4 portrait;margin:5mm}
  body{background:#fff!important}
  .topo-nav,.aviso-autenticada,.topo-acoes{display:none!important}
  .sumula-viewport{display:block;padding:0}
  .sumula-scale{transform:none!important;width:100%!important}
}
</style>
</head>
<body>

<header class="topo-nav">
  <div class="topo-inner">
    <a href="index.html" class="topo-marca">
      <img src="logo.png" alt="DG Sistemas">
      <div>
        <strong>DG SISTEMAS</strong>
        <span>Súmula digital oficial</span>
      </div>
    </a>
    <div class="topo-acoes">
      <a href="sumulas.html" class="btn-top btn-top-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
      <button class="btn-top btn-top-wpp" onclick="compartilharWpp()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
      <button class="btn-top btn-top-pdf" onclick="baixarPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
    </div>
  </div>
</header>

<div class="aviso-autenticada" id="avisoAutenticada">
  <strong><i class="fa-solid fa-circle-check"></i> Súmula Autenticada</strong>
  <p>Documento oficial emitido por DG Sistemas</p>
</div>

<div id="app">
  <div class="loading">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Carregando súmula...</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module">
import { db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app=document.getElementById("app");
const id=new URLSearchParams(location.search).get("id");
const $=id=>document.getElementById(id);
const normalizar=v=>String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function mascararCpf(cpf){
  const limpo=String(cpf||"").replace(/\D/g,"");
  if(limpo.length<3)return "***";
  return "***.***."+limpo.slice(-3);
}

function dataBR(v){
  if(!v)return"-";
  const d=new Date(v+"T00:00:00");
  if(!isNaN(d.getTime()))return d.toLocaleDateString("pt-BR");
  return String(v);
}

function separarEventosPorTime(lista){
  const a=[],b=[];
  (lista||[]).forEach(item=>{ const t=normalizar(item.time||""); if(t==="b")b.push(item);else a.push(item); });
  return{a,b};
}

function renderJogadores(lista){
  if(!Array.isArray(lista)||!lista.length)return`<tr><td colspan="4" class="line-empty">Nenhum jogador.</td></tr>`;
  return lista.map(j=>`<tr><td class="num">${j.numero||"-"}</td><td>${j.nome||"-"}</td><td>${mascararCpf(j.cpf)}</td><td class="posicao">${j.posicao||"-"}</td></tr>`).join("");
}

function renderComissao(lista){
  if(!Array.isArray(lista)||!lista.length)return`<div class="comissao-vazio">Nenhum.</div>`;
  return lista.map(t=>`<div class="comissao-item"><div class="comissao-icone"><i class="fa-solid fa-user-tie"></i></div><div class="comissao-info"><small>${t.funcao||"Comissão"}</small><strong>${t.nome||"-"}</strong></div></div>`).join("");
}

function renderGols(lista){
  if(!lista.length)return`<div class="line-empty">Nenhum gol.</div>`;
  return lista.map(g=>`<div class="event-item"><span class="ball">⚽</span><span class="event-minute">${g.minuto||"-"}'</span><span class="event-name">${g.nome||"-"}</span></div>`).join("");
}

function renderCartoes(lista){
  if(!lista.length)return`<div class="line-empty">Nenhum cartão.</div>`;
  return lista.map(c=>{
    const vermelho=c.tipo!=="amarelo";
    const extra=vermelho?`<small>${c.tipo==="segundo_amarelo"?"2º amarelo":"vermelho direto"}</small>`:"";
    return`<div class="event-item"><span class="${vermelho?"red-card":"yellow-card"}"></span><span class="event-minute">${c.minuto||"-"}'</span><span class="event-name">${c.nome||"-"}${extra}${c.observacao?`<br><small><strong>Motivo:</strong> ${c.observacao}</small>`:""}</span></div>`;
  }).join("");
}

function contarCartoes(lista){
  let a=0,v=0;(lista||[]).forEach(c=>{if(c.tipo==="amarelo")a++;else v++;});
  return{amarelos:a,vermelhos:v};
}

function qrUrl(){
  return`https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(location.href)}`;
}

function ajustarEscala(){
  const sb=document.querySelector(".sumula-scale"),vp=document.querySelector(".sumula-viewport"),pg=document.querySelector(".sumula-page");
  if(!sb||!vp||!pg)return;
  if(window.innerWidth<=900){const esc=window.innerWidth/1120;sb.style.setProperty("--escala-mobile",esc);vp.style.height=(pg.offsetHeight*esc+16)+"px";}
  else{sb.style.removeProperty("--escala-mobile");vp.style.height="auto";}
}

function renderSumula(s){
  const nA=s.timeA?.nome||"Time A";
  const nB=s.timeB?.nome||"Time B";
  const gols=s.gols||[];
  const cartoes=s.cartoes||[];
  const gp=separarEventosPorTime(gols);
  const cp=separarEventosPorTime(cartoes);
  const tc=contarCartoes(cartoes);
  const golsA=s.golsA||gp.a.length;
  const golsB=s.golsB||gp.b.length;

  app.innerHTML=`
  <div class="sumula-viewport">
    <div class="sumula-scale">
      <div class="sumula-page" id="paginaSumula">

        <header class="header">
          <div class="header-logo"><img src="logo.png" alt="DG Sistemas"></div>
          <div class="header-title"><h1>SÚMULA OFICIAL</h1><p>DG Sistemas</p><span>Onde o talento encontra o futuro</span></div>
          <div class="header-campeonato-logo"><img src="logo.png" alt="DG"></div>
          <div class="header-right">
            <div class="liga-nome">${s.campeonato||"CAMPEONATO"}</div>
            <div class="liga-slogan">${s.categoria||""}</div>
          </div>
        </header>

        <section class="info-strip">
          <div class="info-box"><i class="fa-regular fa-file-lines"></i><div><small>Súmula Nº</small><strong>${s.numeroSumula||"-"}</strong></div></div>
          <div class="info-box"><i class="fa-solid fa-barcode"></i><div><small>Código</small><strong>${s.codigoPartida||"-"}</strong></div></div>
          <div class="info-box"><i class="fa-solid fa-trophy"></i><div><small>Rodada</small><strong>${s.rodada||"-"}</strong></div></div>
          <div class="info-box"><i class="fa-solid fa-calendar"></i><div><small>Data</small><strong>${dataBR(s.data)}</strong></div></div>
          <div class="info-box"><div><small>Status</small><strong class="status-finalizado"><i class="fa-solid fa-check"></i> FINALIZADO</strong></div></div>
        </section>

        <section class="score-card">
          <div class="team-score"><div class="team-name"><h2>${nA}</h2></div></div>
          <div class="score-center"><div class="score-number">${golsA} x ${golsB}</div><span>Placar Final</span></div>
          <div class="team-score away"><div class="team-name"><h2>${nB}</h2></div></div>
        </section>

        <section class="match-strip">
          <div class="match-box"><i class="fa-regular fa-calendar-days"></i><div><small>Data</small><strong>${dataBR(s.data)}</strong></div></div>
          <div class="match-box"><i class="fa-regular fa-clock"></i><div><small>Horário</small><strong>${s.hora||"-"}</strong></div></div>
          <div class="match-box"><i class="fa-solid fa-diamond"></i><div><small>Campo</small><strong>${s.local||"-"}</strong></div></div>
          <div class="match-box"><i class="fa-solid fa-whistle"></i><div><small>Árbitro</small><strong>${s.arbitro||"-"}</strong></div></div>
        </section>

        <section class="lineups">
          <div class="section-title">Escalações</div>
          <div class="lineups-grid">
            <div class="lineup-card"><div class="lineup-head">${nA}</div><table class="table"><thead><tr><th class="num">Nº</th><th>Jogador</th><th>CPF</th><th class="posicao">Posição</th></tr></thead><tbody>${renderJogadores(s.jogadoresA)}</tbody></table></div>
            <div class="lineup-card"><div class="lineup-head">${nB}</div><table class="table"><thead><tr><th class="num">Nº</th><th>Jogador</th><th>CPF</th><th class="posicao">Posição</th></tr></thead><tbody>${renderJogadores(s.jogadoresB)}</tbody></table></div>
          </div>
        </section>

        <section class="comissao">
          <div class="section-title">Comissão Técnica</div>
          <div class="comissao-grid">
            <div class="comissao-card"><div class="comissao-head">${nA}</div><div class="comissao-lista">${renderComissao([
              ...(s.tecnicoA?[{nome:s.tecnicoA,funcao:"Técnico"}]:[]),
              ...(s.auxiliarA?[{nome:s.auxiliarA,funcao:"Auxiliar"}]:[])
            ])}</div></div>
            <div class="comissao-card"><div class="comissao-head">${nB}</div><div class="comissao-lista">${renderComissao([
              ...(s.tecnicoB?[{nome:s.tecnicoB,funcao:"Técnico"}]:[]),
              ...(s.auxiliarB?[{nome:s.auxiliarB,funcao:"Auxiliar"}]:[])
            ])}</div></div>
          </div>
        </section>

        <section class="events-grid">
          <div class="team-events"><h3>${nA}</h3><div class="events-columns"><div class="event-col"><h4>Gols</h4>${renderGols(gp.a)}</div><div class="event-col"><h4>Cartões</h4>${renderCartoes(cp.a)}</div></div></div>
          <div class="team-events"><h3>${nB}</h3><div class="events-columns"><div class="event-col"><h4>Gols</h4>${renderGols(gp.b)}</div><div class="event-col"><h4>Cartões</h4>${renderCartoes(cp.b)}</div></div></div>
        </section>

        <section class="lower-grid">
          <div class="panel"><h3>Arbitragem</h3>
            <div class="official-row"><div class="official-label"><i class="fa-solid fa-user-tie"></i> Árbitro</div><div class="official-value">${s.arbitro||"-"}</div></div>
            <div class="official-row"><div class="official-label"><i class="fa-solid fa-flag"></i> Assistente 1</div><div class="official-value">${s.assistente1||"-"}</div></div>
            <div class="official-row"><div class="official-label"><i class="fa-solid fa-flag"></i> Assistente 2</div><div class="official-value">${s.assistente2||"-"}</div></div>
            <div class="official-row"><div class="official-label"><i class="fa-solid fa-user-shield"></i> 4º Árbitro</div><div class="official-value">${s.quartoArbitro||"-"}</div></div>
            <div class="official-row"><div class="official-label"><i class="fa-solid fa-location-dot"></i> Observador</div><div class="official-value">${s.observador||"-"}</div></div>
          </div>
          <div class="panel"><h3>Resumo da Partida</h3>
            <div class="summary-grid">
              <div class="summary-box"><i class="fa-solid fa-futbol"></i><span>Gols</span><strong>${gols.length||(golsA+golsB)}</strong><div class="summary-detail">(${golsA} x ${golsB})</div></div>
              <div class="summary-box"><div class="summary-card-icon yellow-card"></div><span>Cartões Amarelos</span><strong>${tc.amarelos}</strong><div class="summary-detail">(${cp.a.filter(c=>c.tipo==="amarelo").length} x ${cp.b.filter(c=>c.tipo==="amarelo").length})</div></div>
              <div class="summary-box"><div class="summary-card-icon red-card"></div><span>Cartões Vermelhos</span><strong>${tc.vermelhos}</strong><div class="summary-detail">(${cp.a.filter(c=>c.tipo!=="amarelo").length} x ${cp.b.filter(c=>c.tipo!=="amarelo").length})</div></div>
            </div>
            <div class="best-player"><div class="trophy">🏆</div><div><h4>Melhor jogador da partida</h4><strong>${s.melhorJogador||"-"}</strong><span>${s.melhorJogadorDestaque||"Destaque da partida"}</span></div></div>
          </div>
        </section>

        ${s.observacoes?`
        <section class="comissao">
          <div class="section-title">Observações</div>
          <div style="background:#fff;border:1px solid var(--linha);border-top:none;border-radius:0 0 5px 5px;padding:14px;color:#111;font-size:13px;line-height:1.6;">${s.observacoes}</div>
        </section>`:""}

        <section class="footer-grid">
          <div class="panel"><h3>Autenticação</h3><div class="auth-box"><img src="${qrUrl()}" alt="QR"><div class="auth-text"><strong>SÚMULA OFICIAL</strong><p>${s.publicadaEm||new Date().toLocaleString("pt-BR")}</p><p>Código de verificação</p><div class="auth-code">${s.codigo||s.codigoPartida||"---"}</div><p>Escaneie o QR Code para verificar a autenticidade.</p></div></div></div>
          <div class="panel"><h3>Compartilhar</h3><div class="buttons">
            <button class="btn btn-whats" onclick="compartilharWpp()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
            <button class="btn btn-email" onclick="enviarEmail()"><i class="fa-solid fa-envelope"></i> E-mail</button>
            <button class="btn btn-link" onclick="copiarLink()"><i class="fa-solid fa-link"></i> Link</button>
            <button class="btn btn-pdf" onclick="baixarPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
          </div></div>
        </section>

        <section class="patrocinio-sumula"><img src="patrocinio.png" alt="Patrocínio"></section>
        <footer class="final-footer"><div>Documento oficial gerado pelo sistema DG Sistemas</div><div>© 2026 DG Sistemas — Todos os direitos reservados</div></footer>
      </div>
    </div>
  </div>`;
  setTimeout(ajustarEscala,100);
}

window.compartilharWpp=function(){
  const texto=`📋 *SÚMULA OFICIAL - DG Sistemas*\n\n${location.href}`;
  window.open("https://wa.me/?text="+encodeURIComponent(texto),"_blank");
};

window.enviarEmail=function(){
  const assunto=encodeURIComponent("Súmula Oficial - DG Sistemas");
  const corpo=encodeURIComponent("Segue o link da súmula:\n\n"+location.href);
  location.href=`mailto:?subject=${assunto}&body=${corpo}`;
};

window.copiarLink=async function(){
  try{await navigator.clipboard.writeText(location.href);alert("Link copiado!");}catch(e){alert("Erro ao copiar.");}
};

window.baixarPDF=function(){
  ajustarEscala();
  setTimeout(()=>window.print(),300);
};

async function carregar(){
  if(!id){
    app.innerHTML=`<div class="erro"><i class="fa-solid fa-triangle-exclamation"></i><h2>Súmula não informada</h2><p>O link está incompleto.</p></div>`;
    return;
  }
  try{
    const snap=await getDoc(doc(db,"sumulas",id));
    if(!snap.exists()){
      app.innerHTML=`<div class="erro"><i class="fa-solid fa-circle-xmark"></i><h2>Súmula não encontrada</h2><p>Ela pode ter sido apagada ou o link está errado.</p></div>`;
      return;
    }
    const s={id:snap.id,...snap.data()};
    renderSumula(s);
  }catch(e){
    console.error(e);
    app.innerHTML=`<div class="erro"><i class="fa-solid fa-triangle-exclamation"></i><h2>Erro ao carregar</h2><p>Confira a conexão e tente de novo.</p></div>`;
  }
}

window.addEventListener("resize",ajustarEscala);
carregar();
</script>
</body>
</html>
