<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Súmula - DG Sistemas</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--azul:#061d44;--azul2:#08285c;--verde:#069447;--dourado:#f7c600;--linha:#cfd7e3;--texto:#071833;--muted:#4b5563;--bg:#dfe6ef}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--texto)}
button{font-family:inherit;cursor:pointer;border:none;transition:.2s}
input,select,textarea{font-family:inherit;outline:none}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
.topo-nav{background:linear-gradient(135deg,var(--azul),var(--azul2));border-bottom:4px solid var(--dourado);padding:12px 18px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.topo-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topo-marca{display:flex;align-items:center;gap:12px}
.topo-marca img{width:46px;height:46px;object-fit:contain}
.topo-marca strong{color:var(--dourado);font-size:16px;font-weight:900;letter-spacing:1.2px;display:block}
.topo-marca span{color:#cbd6ea;font-size:11px;display:block;margin-top:2px}
.topo-acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn-top{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:9px;font-weight:900;font-size:13px}
.btn-top-voltar{background:rgba(255,255,255,.15);color:#fff}
.btn-top-pdf{background:#dc2626;color:#fff}
.btn-top-wpp{background:#25d366;color:#fff}
.loading,.erro{max-width:600px;margin:80px auto;text-align:center;background:#fff;border-radius:16px;padding:40px 20px;box-shadow:0 12px 30px rgba(0,0,0,.15)}
.loading i,.erro i{font-size:48px;color:var(--azul);margin-bottom:14px;display:block}
.loading p,.erro p{color:var(--muted);font-size:15px;font-weight:900}
.erro h2{color:#dc2626;font-size:20px;font-weight:900;margin-bottom:8px}
</style>
</head>
<body>

<header class="topo-nav">
  <div class="topo-inner">
    <a href="index.html" class="topo-marca">
      <img src="logo.png" alt="DG Sistemas">
      <div>
        <strong>DG SISTEMAS</strong>
        <span>Súmula digital oficial</span>
      </div>
    </a>
    <div class="topo-acoes">
      <a href="index.html" class="btn-top btn-top-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
      <a href="sumulas.html" class="btn-top btn-top-voltar"><i class="fa-solid fa-file-lines"></i> Súmulas</a>
    </div>
  </div>
</header>

<div id="app">
  <div class="loading">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Carregando formulário...</p>
  </div>
</div>

<script type="module">
// Este arquivo é o formulário de criação de súmula.
// Se você está vendo uma tela de erro "Súmula não informada",
// é porque este arquivo foi sobrescrito por engano.
const app=document.getElementById("app");
app.innerHTML=`
  <div style="max-width:600px;margin:60px auto;background:#fff;border-radius:16px;padding:40px 30px;box-shadow:0 12px 30px rgba(0,0,0,.15);text-align:center">
    <i class="fa-solid fa-triangle-exclamation" style="font-size:56px;color:#dc2626;display:block;margin-bottom:20px"></i>
    <h2 style="color:#061d44;font-size:22px;font-weight:900;margin-bottom:12px">Arquivo sobrescrito</h2>
    <p style="color:#4b5563;font-size:15px;line-height:1.6;margin-bottom:20px">
      Este arquivo (<b>sumula-offline.html</b>) foi substituído por engano com o conteúdo do <b>sumula-publica.html</b>.
    </p>
    <p style="color:#4b5563;font-size:14px;line-height:1.6">
      Você precisa subir novamente o conteúdo original do formulário de criação de súmula.
    </p>
    <div style="margin-top:24px;padding:16px;background:#fef3c7;border:1px solid #f7c600;border-radius:10px;text-align:left;font-size:13px;color:#854d0e">
      <b>Ação:</b> Volte ao seu backup ou ao arquivo antigo e cole o conteúdo correto aqui no GitHub.
    </div>
  </div>
`;
</script>
</body>
</html>
