<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Súmula Autenticada - DG Sistemas</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --azul:#061d44;--azul2:#08285c;--verde:#069447;--dourado:#f7c600;
  --linha:#cfd7e3;--texto:#071833;--muted:#4b5563;--bg:#dfe6ef;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--texto)}
button{font-family:inherit;cursor:pointer;border:none;transition:.2s}
img{display:block;max-width:100%}

.selo{
  background:linear-gradient(135deg,var(--verde),#0aa956);
  color:#fff;text-align:center;padding:16px;
  border-bottom:4px solid var(--dourado);
}
.selo h1{font-size:22px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.selo h1 i{margin-right:8px}
.selo p{font-size:13px;margin-top:6px;opacity:.95}

.viewport{width:100%;overflow:hidden;display:flex;justify-content:center;padding:14px 8px}
.scale{width:1120px;max-width:1120px;transform-origin:top center}
.page{
  width:1120px;max-width:1120px;margin:0 auto;background:#fff;
  border:1px solid #b9c4d4;border-radius:7px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}

.header{
  display:grid;grid-template-columns:145px 1.35fr 145px 260px;
  align-items:center;gap:14px;padding:16px 22px 18px;
  background:radial-gradient(circle at top left,rgba(255,255,255,.10),transparent 32%),
    linear-gradient(135deg,#041b40 0%,#06265a 55%,#061d44 100%);
  color:#fff;border-bottom:4px solid var(--dourado);position:relative;overflow:hidden;
}
.header:after{
  content:"";position:absolute;right:-70px;bottom:-28px;width:310px;height:70px;
  border-top:5px solid var(--dourado);transform:rotate(-12deg);opacity:.95;
}
.header-logo,.header-campeonato-logo{
  display:flex;justify-content:center;align-items:center;position:relative;z-index:1;
}
.header-logo img{width:105px;height:105px;object-fit:contain}
.header-campeonato-logo img{width:104px;height:104px;object-fit:contain;border-radius:16px}
.header-title{text-align:left;position:relative;z-index:1}
.header-title h1{
  color:#fff;font-size:54px;white-space:nowrap;font-weight:900;
  letter-spacing:1px;line-height:.95;text-transform:uppercase;
}
.header-title p{margin-top:8px;color:var(--dourado);font-size:20px;font-weight:900;text-transform:uppercase}
.header-title span{display:block;margin-top:6px;color:#fff;font-size:14px;font-weight:900;text-transform:uppercase}
.header-right{
  text-align:left;color:#fff;font-weight:900;line-height:1.12;
  text-transform:uppercase;position:relative;z-index:1;
}
.header-right .liga-nome{font-size:20px}
.header-right .liga-slogan{margin-top:8px;color:var(--dourado);font-size:16px;font-weight:900}

.info-strip{
  margin:10px 16px 12px;display:grid;
  grid-template-columns:1.1fr 1.45fr .86fr .72fr 1.05fr;
  border:1px solid var(--linha);border-radius:5px;overflow:hidden;
}
.info-box{
  min-height:70px;display:flex;align-items:center;gap:12px;
  padding:9px 12px;border-right:1px solid var(--linha);background:#fff;
}
.info-box:last-child{border-right:none}
.info-box i{width:36px;color:var(--azul);font-size:30px;text-align:center;flex-shrink:0}
.info-box small{
  display:block;font-size:12px;font-weight:900;text-transform:uppercase;
  color:#111;margin-bottom:4px;
}
.info-box strong{
  display:block;color:var(--azul);font-size:15px;font-weight:900;
}
.status-final{
  display:inline-flex!important;align-items:center;justify-content:center;gap:7px;
  background:var(--verde);color:#fff!important;padding:8px 15px;border-radius:8px;
  font-size:15px!important;font-weight:900;
}
.status-final i{color:#fff!important;font-size:18px!important;width:auto!important}

.score-card{
  margin:0 16px 12px;display:grid;grid-template-columns:1fr 250px 1fr;
  min-height:132px;border:1px solid var(--linha);border-radius:5px;overflow:hidden;
}
.team-score{
  display:flex;align-items:center;justify-content:center;gap:18px;
  padding:13px;background:#fff;
}
.team-name{text-align:center;flex:1}
.team-name h2{
  color:var(--azul);font-size:31px;font-weight:900;
  text-transform:uppercase;line-height:1.05;
}
.score-center{
  background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-left:1px solid var(--linha);border-right:1px solid var(--linha);
}
.score-number{font-size:70px;font-weight:900;letter-spacing:4px;line-height:1;color:var(--dourado)}
.score-center span{margin-top:8px;text-transform:uppercase;font-size:14px;font-weight:900}

.match-strip{
  margin:0 16px 12px;display:grid;
  grid-template-columns:1fr 1fr 1.35fr 1.1fr;
  border:1px solid var(--linha);border-radius:5px;overflow:hidden;
}
.match-box{
  display:flex;align-items:center;gap:12px;min-height:64px;
  padding:10px 12px;border-right:1px solid var(--linha);background:#fff;
}
.match-box:last-child{border-right:none}
.match-box i{width:34px;color:var(--azul);font-size:30px;text-align:center}
.match-box small{
  display:block;color:var(--azul);text-transform:uppercase;font-weight:900;
  font-size:12px;margin-bottom:3px;
}
.match-box strong{display:block;color:#111;font-size:15px;font-weight:900}

.section-title{
  background:var(--azul);color:#fff;text-align:center;padding:8px 10px;
  font-size:20px;font-weight:900;text-transform:uppercase;
  border-radius:5px 5px 0 0;
}
.wrap-sec{margin:0 16px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-branco{
  border:1px solid var(--linha);border-radius:0 0 5px 5px;overflow:hidden;background:#fff;
}
.lineup-head{
  min-height:42px;display:flex;align-items:center;justify-content:center;
  color:var(--azul);font-size:20px;font-weight:900;text-transform:uppercase;
  background:#fff;border-bottom:1px solid var(--linha);
}
table.jogadores{width:100%;border-collapse:collapse;table-layout:fixed}
table.jogadores th{
  background:#f5f7fb;color:var(--azul);font-size:11px;
  text-transform:uppercase;padding:6px 5px;border:1px solid var(--linha);text-align:left;
}
table.jogadores td{
  color:#111;font-size:12px;padding:5px 6px;border:1px solid #e5eaf1;
}
table.jogadores .num{width:48px;text-align:center}
table.jogadores .cpf{width:100px}
table.jogadores .pos{width:140px}
table.jogadores .sub-row td{
  background:#f8fafc;color:var(--azul);text-align:center;
  font-weight:900;text-transform:uppercase;padding:6px;font-size:12px;
}
.line-empty{color:#777;font-size:12px;text-align:center;padding:12px}

.comissao-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.comissao-card{
  border:1px solid var(--linha);border-radius:0 0 5px 5px;overflow:hidden;background:#fff;
}
.comissao-head{
  background:#f5f7fb;color:var(--azul);text-align:center;
  padding:8px;font-size:16px;font-weight:900;text-transform:uppercase;
  border-bottom:1px solid var(--linha);
}
.comissao-lista{padding:12px;display:grid;gap:8px}
.comissao-item{
  display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;
  padding:8px;border:1px solid #dbe3ef;border-radius:8px;background:#f8fafc;
}
.comissao-icone{
  display:flex;align-items:center;gap:6px;color:var(--azul);font-weight:900;font-size:11px;
}
.comissao-nome{color:#111;font-weight:700;font-size:12px}

.events-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.team-events{border:1px solid var(--linha);border-radius:5px;overflow:hidden;background:#fff}
.team-events h3{
  color:#fff;background:var(--azul);text-align:center;padding:8px;
  font-size:18px;font-weight:900;text-transform:uppercase;
}
.team-events.away h3{background:#8b0000}
.event-columns{display:grid;grid-template-columns:1fr 1fr}
.event-col{min-height:130px;padding:12px;border-right:1px solid var(--linha)}
.event-col:last-child{border-right:none}
.event-col h4{
  color:var(--azul);text-align:center;font-size:16px;
  font-weight:900;text-transform:uppercase;margin-bottom:10px;
}
.event-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-bottom:1px solid #e5eaf1;
  font-size:12px;color:#111;
}
.event-item:last-child{border-bottom:none}
.event-min{color:var(--azul);font-weight:900;min-width:38px}
.event-num{color:#666;font-weight:900;min-width:28px}

.lower-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}
.panel{border:1px solid var(--linha);border-radius:5px;overflow:hidden;background:#fff}
.panel h3{
  background:var(--azul);color:#fff;text-align:center;padding:8px;
  font-size:17px;font-weight:900;text-transform:uppercase;
}
.official-row{
  display:grid;grid-template-columns:150px 1fr;min-height:40px;
  border-bottom:1px solid var(--linha);align-items:center;
}
.official-row:last-child{border-bottom:none}
.official-label{
  display:flex;align-items:center;gap:8px;color:var(--azul);
  font-size:12px;font-weight:900;text-transform:uppercase;padding:8px 12px;
}
.official-value{color:#111;font-size:13px;padding:8px 12px;font-weight:700}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--linha)}
.summary-box{text-align:center;padding:12px 8px;border-right:1px solid var(--linha)}
.summary-box:last-child{border-right:none}
.summary-box span{
  display:block;color:var(--azul);font-size:11px;font-weight:900;text-transform:uppercase;
}
.summary-box strong{
  display:block;color:var(--azul);font-size:28px;font-weight:900;margin-top:4px;
}
.melhor-area{
  padding:12px;display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center;
}
.trofeu{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--dourado),#ffe45c);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.melhor-area h4{
  color:var(--azul);font-size:11px;font-weight:900;
  text-transform:uppercase;margin-bottom:4px;
}
.melhor-area strong{color:#111;font-size:16px;font-weight:900;display:block}
.melhor-area span{color:var(--azul);font-size:12px;display:block;margin-top:2px}

.obs-content{
  padding:12px;background:#fff;border:1px solid var(--linha);border-radius:0 0 5px 5px;
  color:#111;font-size:13px;line-height:1.6;min-height:60px;
}

.rodape-final{
  display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;margin:0 16px 12px;
}
.auth-box{
  display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;
  padding:12px;background:#fff;border:1px solid var(--linha);border-radius:5px;
}
#qrcode{width:120px;height:120px;background:#fff;padding:4px;border:1px solid #cfd7e3;border-radius:8px}
#qrcode img,#qrcode canvas{width:100%;height:100%;display:block}
.auth-text strong{
  display:block;color:var(--azul);font-size:13px;font-weight:900;
  text-transform:uppercase;margin-bottom:4px;
}
.auth-text p{color:#4b5563;font-size:11.5px;line-height:1.4;margin-bottom:4px}
.auth-codigo{
  color:var(--azul);font-size:20px;font-weight:900;
  letter-spacing:2px;margin:6px 0;
}
.botoes-final{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:12px;background:#fff;border:1px solid var(--linha);border-radius:5px;align-content:center;
}
.btn-final{
  padding:12px 14px;border-radius:10px;font-weight:900;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-pdf{background:#dc2626;color:#fff}
.btn-whats{background:#25d366;color:#fff}
.btn-voltar{background:var(--azul);color:#fff;grid-column:1/-1}

.patrocinio-sumula{
  width:100%;background:#061d44;margin:0;padding:10px 16px;
  border-top:4px solid var(--dourado);
}
.patrocinio-sumula img{
  width:100%;max-height:150px;object-fit:contain;margin:0 auto;
}
.final-footer{
  background:linear-gradient(135deg,var(--azul),var(--azul2));
  color:#fff;text-align:center;padding:9px;font-size:12px;line-height:1.4;
}

.erro-box{
  max-width:600px;margin:60px auto;padding:40px 20px;
  background:#fff;border:2px solid #dc2626;border-radius:14px;text-align:center;
}
.erro-box i{font-size:60px;color:#dc2626;margin-bottom:16px}
.erro-box h2{color:#dc2626;font-size:22px;font-weight:900;margin-bottom:10px}
.erro-box p{color:#666;font-size:14px;line-height:1.5}

@media(max-width:900px){
  .viewport{justify-content:flex-start;padding:8px 0}
  .scale{transform:scale(var(--escala-mobile,1));transform-origin:top left}
  .grid2,.comissao-grid,.lower-grid,.events-grid,.event-columns,.rodape-final{grid-template-columns:1fr}
  .auth-box{grid-template-columns:1fr;text-align:center}
  #qrcode{margin:0 auto}
}
@media print{
  @page{size:A4 portrait;margin:5mm}
  body{background:#fff!important}
  .selo,.botoes-final,.btn-final{display:none!important}
  .viewport{display:block;padding:0}
  .scale{transform:none!important;width:100%!important}
}
</style>
</head>
<body>

<div class="selo" id="seloTopo">
  <h1><i class="fa-solid fa-circle-check"></i> Súmula Autenticada</h1>
  <p>Documento oficial emitido e autenticado por DG Sistemas</p>
</div>

<div id="app">
  <div style="text-align:center;padding:60px 20px;">
    <i class="fa-solid fa-spinner fa-spin" style="font-size:48px;color:#061d44;"></i>
    <p style="margin-top:16px;color:#4b5563;font-weight:900;">Carregando súmula autenticada...</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const codigo = params.get("codigo");

function campo(obj, chaves, fb){
  for(const c of chaves){ if(obj && obj[c] !== undefined && obj[c] !== null && obj[c] !== "") return obj[c]; }
  return fb;
}
function cpfMask(cpf){
  const limpo = String(cpf || "").replace(/\D/g,"");
  if(limpo.length < 3) return "***";
  return "***.***." + limpo.slice(-3);
}
function dtBR(v){
  if(!v) return "-";
  const p = String(v).split("-");
  if(p.length === 3) return p[2]+"/"+p[1]+"/"+p[0];
  return v;
}

function opcoesRenderJogadores(lista){
  if(!Array.isArray(lista) || !lista.length){
    return `<tr><td colspan="4" class="line-empty">Nenhum jogador informado.</td></tr>`;
  }
  const tit = lista.filter(j => (j.tipo || "titular") !== "suplente");
  const sup = lista.filter(j => j.tipo === "suplente");
  return `
    <tr class="sub-row"><td colspan="4">Titulares</td></tr>
    ${tit.map(j => `
      <tr>
        <td class="num">${j.num || "-"}</td>
        <td>${j.nome || "-"}</td>
        <td class="cpf">${cpfMask(j.cpf)}</td>
        <td class="pos">${j.pos || "-"}</td>
      </tr>`).join("")}
    <tr class="sub-row"><td colspan="4">Suplentes</td></tr>
    ${sup.length ? sup.map(j => `
      <tr>
        <td class="num">${j.num || "-"}</td>
        <td>${j.nome || "-"}</td>
        <td class="cpf">${cpfMask(j.cpf)}</td>
        <td class="pos">${j.pos || "-"}</td>
      </tr>`).join("") : `<tr><td colspan="4" class="line-empty">Nenhum suplente.</td></tr>`}
  `;
}

function renderComissao(lista){
  if(!lista || !lista.length) return `<div class="line-empty">Nenhum informado.</div>`;
  return lista.map(t => `
    <div class="comissao-item">
      <div class="comissao-icone"><i class="fa-solid fa-user-tie"></i> ${t.funcao || "Técnico"}</div>
      <div class="comissao-nome">${t.nome || "-"}</div>
    </div>`).join("");
}

function renderGols(lista){
  if(!lista || !lista.length) return `<div class="line-empty">Nenhum gol.</div>`;
  return lista.map(g => `
    <div class="event-item">
      <span class="event-min">⚽ ${g.min||'-'}'</span>
      <span class="event-num">${g.num ? '#'+g.num : ''}</span>
      <span>${g.jog || '-'}</span>
    </div>`).join("");
}

function renderCartoes(lista){
  if(!lista || !lista.length) return `<div class="line-empty">Nenhum cartão.</div>`;
  return lista.map(c => `
    <div class="event-item">
      <span class="event-min">${c.tipo==='amarelo'?'🟨':'🟥'} ${c.min||'-'}'</span>
      <span class="event-num">${c.num ? '#'+c.num : ''}</span>
      <span>${c.jog || '-'}</span>
    </div>`).join("");
}

function renderSumula(s){
  const nomeA = s.timeA || "TIME A";
  const nomeB = s.timeB || "TIME B";
  const gA = (s.golsA || []).length;
  const gB = (s.golsB || []).length;
  const todosCart = [...(s.cartoesA||[]), ...(s.cartoesB||[])];
  const amarelos = todosCart.filter(c => c.tipo === "amarelo").length;
  const vermelhos = todosCart.filter(c => c.tipo === "vermelho").length;
  const codigo = s.codigoVerif || "-";
  const qrUrl = location.href;

  return `
    <div class="viewport"><div class="scale"><div class="page">

      <header class="header">
        <div class="header-logo"><img src="logo.png" alt="DG Sistemas"></div>
        <div class="header-title">
          <h1>SÚMULA OFICIAL</h1>
          <p>DG Sistemas</p>
          <span>Onde o talento encontra o futuro</span>
        </div>
        <div class="header-campeonato-logo"><img src="logo.png" alt="DG"></div>
        <div class="header-right">
          <div class="liga-nome">${s.competicao || "CAMPEONATO"}</div>
          <div class="liga-slogan">${s.categoria || ""}</div>
        </div>
      </header>

      <section class="info-strip">
        <div class="info-box"><i class="fa-regular fa-file-lines"></i><div><small>Súmula Nº</small><strong>${s.numeroSumula || "-"}</strong></div></div>
        <div class="info-box"><i class="fa-solid fa-barcode"></i><div><small>Código</small><strong>${s.codigoSumula || "-"}</strong></div></div>
        <div class="info-box"><i class="fa-solid fa-trophy"></i><div><small>Competição</small><strong>${s.competicao || "-"}</strong></div></div>
        <div class="info-box"><i class="fa-solid fa-list-ol"></i><div><small>Categoria</small><strong>${s.categoria || "-"}</strong></div></div>
        <div class="info-box"><div><small>Status</small><strong class="status-final"><i class="fa-solid fa-check"></i> AUTENTICADA</strong></div></div>
      </section>

      <section class="score-card">
        <div class="team-score"><div class="team-name"><h2>${nomeA}</h2></div></div>
        <div class="score-center">
          <div class="score-number">${gA} x ${gB}</div>
          <span>Placar Final</span>
        </div>
        <div class="team-score"><div class="team-name"><h2>${nomeB}</h2></div></div>
      </section>

      <section class="match-strip">
        <div class="match-box"><i class="fa-regular fa-calendar-days"></i><div><small>Data</small><strong>${dtBR(s.dataJogo)}</strong></div></div>
        <div class="match-box"><i class="fa-regular fa-clock"></i><div><small>Horário</small><strong>${s.horaJogo || "-"}</strong></div></div>
        <div class="match-box"><i class="fa-solid fa-diamond"></i><div><small>Local</small><strong>${s.localJogo || "-"}</strong></div></div>
        <div class="match-box"><i class="fa-solid fa-whistle"></i><div><small>Árbitro</small><strong>${s.arbitro || "-"}</strong></div></div>
      </section>

      <section class="wrap-sec">
        <div class="section-title">Escalações</div>
        <div class="grid2">
          <div class="card-branco">
            <div class="lineup-head">${nomeA}</div>
            <table class="jogadores">
              <thead><tr><th class="num">Nº</th><th>Jogador</th><th class="cpf">CPF</th><th class="pos">Posição</th></tr></thead>
              <tbody>${opcoesRenderJogadores(s.jogadoresA)}</tbody>
            </table>
          </div>
          <div class="card-branco">
            <div class="lineup-head">${nomeB}</div>

async function buscarPorCodigo(cod){
  const q = query(collection(db, "sumulas"), where("codigoVerif", "==", cod));
  const snap = await getDocs(q);
  if(snap.empty) return null;
  const doc = snap.docs[0];
  return { id: doc.id, ...doc.data() };
}
